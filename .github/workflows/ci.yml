name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI 只需读取代码
permissions:
  contents: read

# 同一分支有新提交时取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions 用 commit SHA 固定，由 pnpm deps:check 检查更新（ADR 0005）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm 版本取自 package.json 的 devEngines.packageManager
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 版本取自 package.json 的 devEngines.runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # 浏览器测试用的 Chromium 无界面版及其系统依赖（ADR 0040）；不缓存，Playwright 不建议缓存浏览器
      - run: pnpm --filter yzt exec playwright install --with-deps --only-shell chromium
      - run: pnpm test
      # 默认以外的三维引擎也内网构建一次，入口的静态依赖检查同样要成立，再跑这种引擎的三维冒烟（ADR 0147 第 7 节）；
      # 冒烟用 loadEnv 读同一个变量判断产物用的引擎。之后的构建覆盖这次的产物
      - run: pnpm build:intranet
        env:
          VITE_MAP_3D_ENGINE: maplibre
      - run: pnpm --filter yzt test:smoke scene-maplibre
        timeout-minutes: 5
        env:
          VITE_MAP_3D_ENGINE: maplibre
          DEBUG: pw:webserver
      - run: pnpm build
      - run: pnpm build:intranet
      # 使用刚生成的生产产物和本地固定数据，不访问真实后端或天地图
      - run: pnpm --filter yzt test:smoke
        timeout-minutes: 10
        env:
          # 记录预览进程启动和退出，区分用例失败与收尾卡住
          DEBUG: pw:webserver
