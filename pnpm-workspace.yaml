packages:
  - "apps/*"
  - "packages/*"

# 新版本发布满 3 天才允许安装，对应 npm 允许撤回版本的 72 小时窗口（ADR 0005）
minimumReleaseAge: 4320

# 依赖的安装脚本默认不执行，逐个决定是否放行
allowBuilds:
  # 以下包已有各平台预编译包，安装脚本只在缺少预编译时补装或从源码构建
  "@parcel/watcher": false
  "unrs-resolver": false
  # 安装脚本只把浏览器端的 Service Worker 复制到 msw.workerDirectory；项目只在测试中用 msw/node
  "msw": false
  # postinstall 按项目装的是 Vue 2 还是 Vue 3 切换构建文件；包里默认的就是 Vue 3 版，项目只用 Vue 3
  "vue-demi": false
