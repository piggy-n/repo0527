packages:
  - "apps/*"
  - "packages/*"

# 两个及以上的包用到的依赖在这里写一次版本，包里写 catalog:。包经符号链接解析时找的是自己的 node_modules，
# 版本一致才能和应用共用一份 Vue、MapLibre、Cesium（ADR 0143）
catalog:
  "@element-plus/icons-vue": ^2.3.2
  "@maplibre/maplibre-gl-style-spec": ^26.4.4
  "@turf/boolean-point-in-polygon": ^7.4.0
  "@turf/simplify": ^7.4.0
  "@types/geojson": ^7946.0.16
  "@types/node": ^24.19.0
  # three、@types/three 精确锁定（0.x）；驾驶舱和 @mx/map-three 共用一份（ADR 0147 第 5 节），LCC2 要求 0.187 以上（ADR 0149）
  "@types/three": 0.187.0
  "@vitejs/plugin-vue-jsx": ^5.1.6
  "@vitest/browser-playwright": ^5.0.5
  "@vue/test-utils": ^2.5.1
  "@vueuse/core": ^15.0.0
  cesium: 1.146.0
  element-plus: ^2.14.6
  geographiclib-geodesic: ^2.2.0
  jsdom: ^30.1.1
  maplibre-gl: ^6.12.0
  nanoevents: ^10.0.0
  playwright: ^1.64.0
  sass-embedded: ^1.105.0
  three: 0.187.0
  typescript: 7.0.2
  vite: ^8.3.5
  vite-plugin-static-copy: ^4.1.1
  vitest: ^5.0.5
  vue: ^3.5.43

# cesium 是聚合包，对子包写的是 ^：不钉住时刷新 lockfile 会升到和它不配套的版本。升级 cesium 时一起改
overrides:
  "@cesium/core": 0.1.0
  "@cesium/engine": 26.4.0
  "@cesium/widgets": 16.3.0

# 新版本发布满 3 天才允许安装，对应 npm 允许撤回版本的 72 小时窗口（ADR 0005）
minimumReleaseAge: 4320

# 依赖的安装脚本默认不执行，逐个决定是否放行
allowBuilds:
  # 以下包已有各平台预编译包，安装脚本只在缺少预编译时补装或从源码构建
  "@parcel/watcher": false
  "unrs-resolver": false
  # 安装脚本只把浏览器端的 Service Worker 复制到 msw.workerDirectory；项目只在测试中用 msw/node
  "msw": false
  # postinstall 只打印赞助信息（另在系统临时目录写一个去重用的文件），不影响补丁本身
  "core-js": false
  # postinstall 按项目装的是 Vue 2 还是 Vue 3 切换构建文件；包里默认的就是 Vue 3 版，项目只用 Vue 3
  "vue-demi": false
